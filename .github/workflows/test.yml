name: Test
on:
  workflow_dispatch:

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      #  with:
      #    repository: ${{ vars.REPOSITORY }}
      #    ref: ${{ vars.REF }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7.1.4
      - name: Diagnose Zotero
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
        run: |
          uv run python - <<'PY'
          import os
          from pyzotero import zotero
    
          user_id = os.environ["ZOTERO_ID"].strip()
          api_key = os.environ["ZOTERO_KEY"].strip()
    
          z = zotero.Zotero(user_id, "user", api_key)
    
          key_info = z.key_info()
          print("key_user_id_matches:",
                str(key_info.get("userID")) == user_id)
          print("personal_top_level:", z.num_items())
    
          for item_type in (
              "journalArticle",
              "conferencePaper",
              "preprint",
          ):
              items = z.everything(z.items(itemType=item_type))
              with_abstract = sum(
                  bool(item["data"].get("abstractNote", "").strip())
                  for item in items
              )
              print(
                  f"{item_type}: {len(items)}, "
                  f"with_abstract: {with_abstract}"
              )
    
          groups = key_info.get("access", {}).get("groups", {})
          print("key_group_count:", len(groups))
          print("key_group_ids:", sorted(groups))
          PY

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          export DEBUG=true
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          echo "Use custom config: "
          cat config/custom.yaml
          uv run src/zotero_arxiv_daily/main.py
